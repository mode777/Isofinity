name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck + production build — the repo's automated gate.
      - run: npm run build
      # Node-runnable bundle/multi-view checks.
      - run: npm run verify:bundles
